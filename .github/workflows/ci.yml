# Baysöz Labs <baysozlabs@proton.me> — CI quality gates for baysoz-gqlcostgate.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Create environment and install
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep

      - name: Unit and adversarial tests
        run: uv run pytest -q

      - name: Ruff static gate
        run: uv run ruff check --select E,F,W,S,B .

      - name: Semgrep security gate
        run: uv run semgrep --config p/default --error .

      - name: Supreme Grand Jury Tribunal
        run: uv run gqlcostgate tribunal --schema tests/fixtures/schema.graphql

# Baysöz Labs <baysozlabs@proton.me> — red-team fixture schema.
directive @auth on FIELD_DEFINITION
directive @sensitive on FIELD_DEFINITION

schema {
  query: Query
  mutation: Mutation
}

type Query {
  viewer: User
  user(id: ID!): User
  users(first: Int, limit: Int): [User!]!
  items(first: Int): [Item!]!
  adminPanel: Admin
}

type Mutation {
  updateUser(id: ID!, role: String): User
}

type User {
  id: ID!
  name: String!
  email: String @sensitive
  passwordHash: String @sensitive
  friends(first: Int): [User!]!
  posts: [Post!]!
}

type Post {
  id: ID!
  title: String!
  author: User!
}

type Item {
  id: ID!
  name: String!
}

type Admin {
  id: ID!
  secret: String @auth
}

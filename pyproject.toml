# Baysöz Labs <baysozlabs@proton.me> — offline GraphQL adversarial cost oracle.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "baysoz-gqlcostgate"
version = "1.0.0"
description = "Offline GraphQL cost, depth, batching and authorization conformance oracle with deterministic SARIF CI gates and bounded adversarial probe forge by Baysöz Labs <baysozlabs@proton.me>"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Baysöz Labs", email = "baysozlabs@proton.me" }]
keywords = ["appsec", "redteam", "graphql", "sarif", "ci-gate", "baysöz-labs"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = ["graphql-core>=3.2.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9", "semgrep>=1.100"]

[project.scripts]
gqlcostgate = "gqlcostgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gqlcostgate"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
